# picur system NATS daemon — STAGED, authed design (~/Library/NATS/nats-server.conf).
# Install: cp infra/nats-picur.conf ~/Library/NATS/nats-server.conf
#          sudo launchctl kickstart -k system/io.nats.server
#
# Design: wash 2.x hosts CANNOT authenticate to NATS (no creds flag, URL
# userinfo ignored). So clients that CAN auth (daemon, git-provider, tui,
# messaging provider) log in as 'swarm' with full rights; wash hosts connect
# unauthenticated and fall into 'wash-anon', which is denied the sensitive
# subjects (swarm.db.>, swarm.git.>, alpha-swarm.>) but allowed the wasmCloud
# control plane + jetstream the providers need.
listen: 0.0.0.0:4223
server_name: picur
http: 0.0.0.0:8223

authorization {
    users = [
        { user: swarm, password: NATSPASS },          # full-access clients
        {
            user: wash-anon, password: ""           # unauthenticated wash hosts land here
            permissions {
                # Deny the sensitive lattice data; allow everything else
                # (wasmbus control plane, _INBOX replies, jetstream/object store).
                subscribe { deny = ["swarm.>", "alpha-swarm.>"] }
                publish   { deny = ["swarm.db.>", "swarm.git.>", "alpha-swarm.>"] }
            }
        }
    ]
    no_auth_user: wash-anon
}

jetstream {
    store_dir: /Users/markkovari/.local/share/alpha-swarm/nats/jetstream
    max_mem: 1G
    max_file: 10G
}

cluster {
    name: alpha_swarm
    listen: 0.0.0.0:4248
    authorization { user: swarm-route, password: NATSPASS }
    routes = [
        nats-route://swarm-route:NATSPASS@100.81.10.8:6222
        nats-route://swarm-route:NATSPASS@100.111.200.86:6222
    ]
}

max_payload: 8388608

websocket { listen: 0.0.0.0:4225, no_tls: true }
