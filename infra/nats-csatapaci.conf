# NATS server config — csatapaci (node 2 of 2)
# Connects to local machine to form a 2-node cluster.

server_name: csatapaci
listen: 0.0.0.0:4222

jetstream {
    store_dir: "/tmp/alpha-swarm/nats/jetstream"
    max_mem: 1GB
    max_file: 4GB
}

cluster {
    name: alpha-swarm
    listen: 0.0.0.0:6222
    routes: [
        nats-route://100.79.38.122:16222
    ]
}

# Monitoring
http_port: 8222
