# NATS server config — malna / RPi (node 3 of 3)
# 3rd quorum node for fault tolerance.

server_name: malna
listen: 0.0.0.0:4222

jetstream {
    store_dir: "/tmp/alpha-swarm/nats/jetstream"
    max_mem: 512MB
    max_file: 8GB
}

cluster {
    name: alpha-swarm
    listen: 0.0.0.0:6222
    routes: [
        nats-route://100.79.38.122:16222
        nats-route://100.81.10.8:6222
    ]
}

# Monitoring
http_port: 8222
