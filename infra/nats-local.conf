# NATS server config — local machine (node 1 of 2)
# Connects to csatapaci to form a 2-node cluster.

server_name: local
listen: 0.0.0.0:14222

jetstream {
    store_dir: "/tmp/alpha-swarm/nats/jetstream"
    max_mem: 256MB
    max_file: 1GB
}

cluster {
    name: alpha_swarm
    listen: 0.0.0.0:16222
    routes: [
        nats-route://100.81.10.8:6222
    ]
}

# Monitoring disabled — port conflicts locally
# http_port: 8223
