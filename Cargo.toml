[workspace]
members = [
    "components/agent-worker",
    "components/orchestrator",
    "components/gateway",
    "providers/ollama",
    "providers/virtfs",
    "providers/quality-gate",
    "providers/knowledge-base",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
