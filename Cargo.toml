[workspace]
exclude = ["frontend"]
members = [
    "crates/config",
    "crates/inference-client",
    "crates/edit-parser",
    "crates/agent-core",
    "crates/quality-gate",
    "crates/knowledge-base",
    "crates/events",
    "crates/orchestrator",
    "crates/tools",
    "crates/agent-daemon",
    "crates/event-consumer",
    "crates/alpha-swarm-cli",
    "components/agent-worker",
    "components/web-ui",
    "components/tool-search",
    "components/tool-web",
    "providers/git-provider",
    "providers/test-provider",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
