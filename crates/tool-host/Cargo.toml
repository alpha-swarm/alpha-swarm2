[package]
name = "tool-host"
version.workspace = true
edition.workspace = true
license.workspace = true

# Owns the embedded Wassette runtime (which embeds wasmtime), mirroring how
# knowledge-base owns the embedded SurrealDB handle. Pinned to the v0.4.0 tag
# commit because wassette is git-only (not on crates.io) and pre-1.0.
[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
swarm-config = { path = "../config" }
swarm-tools = { path = "../tools" }
wassette = { git = "https://github.com/microsoft/wassette", rev = "3534d7d91baf9063b347a04c91998deacc2262dd" }

[dev-dependencies]
tokio = { workspace = true }
