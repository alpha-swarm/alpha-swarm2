[package]
name = "agent-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

swarm-config = { path = "../config" }
inference-client = { path = "../inference-client" }
agent-core = { path = "../agent-core" }
swarm-orchestrator = { path = "../orchestrator" }
swarm-workflow = { path = "../workflow" }
knowledge-base = { path = "../knowledge-base" }
swarm-tools = { path = "../tools" }
tool-host = { path = "../tool-host" }
quality-gate-lib = { path = "../quality-gate" }
swarm-events = { path = "../events" }
async-nats = "0.38"
async-trait.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
sha2 = "0.10"
chrono = "0.4"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["json"] }
virt-git = { path = "../virt-git" }
