[package]
name = "swarm-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
inference-client = { path = "../inference-client", default-features = false }
agent-core = { path = "../agent-core", default-features = false }
swarm-config = { path = "../config", default-features = false }
virt-git = { path = "../virt-git", optional = true }

# Native-only
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
quality-gate-lib = { path = "../quality-gate", optional = true }
knowledge-base = { path = "../knowledge-base", optional = true }
swarm-tools = { path = "../tools", optional = true }
async-nats = { version = "0.38", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = ["native"]
native = [
    "inference-client/native", "agent-core/native",
    "tokio", "tracing", "uuid",
    "quality-gate-lib", "knowledge-base", "swarm-tools",
    "async-nats", "virt-git", "reqwest", "chrono",
]
