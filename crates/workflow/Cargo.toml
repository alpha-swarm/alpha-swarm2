[package]
name = "swarm-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
swarm-orchestrator = { path = "../orchestrator", default-features = false }
inference-client = { path = "../inference-client", default-features = false }
knowledge-base = { path = "../knowledge-base", default-features = false }
swarm-config = { path = "../config", default-features = false }

# Native-only
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true }
swarm-events = { path = "../events", optional = true, default-features = false }

[features]
default = ["native"]
native = [
    "swarm-orchestrator/native", "knowledge-base/native", "inference-client/native",
    "swarm-events", "swarm-events/native",
    "tokio", "tracing", "chrono",
]

[dev-dependencies]
tokio = { workspace = true }
