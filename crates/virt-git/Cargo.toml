[package]
name = "virt-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory content-addressed git — WASI-portable, no filesystem"

[dependencies]
sha2 = "0.10"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NATS backend (optional — not WASI-portable)
async-nats = { version = "0.38", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
edit-parser = { path = "../edit-parser" }

[features]
default = []
nats = ["async-nats", "tokio", "futures"]
