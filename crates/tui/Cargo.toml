[package]
name = "alpha-swarm-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "swarm-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
async-nats = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
futures = "0.3"
swarm-events = { path = "../events" }
