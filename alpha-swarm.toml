# alpha-swarm configuration
# Override with environment variables: ALPHA_SWARM_OLLAMA_URL, etc.

[ollama]
url = "http://100.81.10.8:11434"

[surrealdb]
url = "127.0.0.1:8001"
namespace = "alpha_swarm"
database = "swarm"
username = "root"
password = "root"

[nats]
url = "nats://127.0.0.1:4223"

[claude]
# api_key = ""  # Set via ANTHROPIC_API_KEY env var
model = "claude-sonnet-4-20250514"

[defaults]
embed_model = "qwen2.5-coder:7b"
simple_model = "qwen2.5-coder:7b"
project = "default"

# --- Agent Tiers ---
# Orchestrator + Agent: same model to avoid swap overhead
# Orchestrator: fast planner
[tiers.orchestrator]
model = "qwen2.5-coder:14b"
context_window = 16384
time_limit_secs = 14400         # 4 hours
token_limit = 1000000           # 1M tokens
max_iterations = 20
max_backoff_secs = 60
max_context_files = 100

[tiers.agent]
model = "qwen2.5-coder:32b"
context_window = 16384
time_limit_secs = 1800          # 30 min
token_limit = 300000            # 300K tokens
max_iterations = 10
max_backoff_secs = 30
max_context_files = 50

# Worker: small focused tasks, fast model
# --- Resource Limits ---
# Daemon won't start new tasks if resource usage exceeds these thresholds
[resources]
max_cpu_percent = 80.0
max_ram_percent = 80.0
check_interval_secs = 10
max_concurrent_agents = 3
max_sub_plan_depth = 3

[[resources.hosts]]
name = "local"
type = "local"

[[resources.hosts]]
name = "csatapaci"
type = "ollama"
ollama_url = "http://100.81.10.8:11434"

[tiers.worker]
model = "qwen2.5-coder:7b"
context_window = 8192
time_limit_secs = 300           # 5 min
token_limit = 100000            # 100K tokens
max_iterations = 5
max_backoff_secs = 10
max_context_files = 20

# --- Inference Providers ---
# Multiple Ollama hosts, router picks best available
[[providers]]
type = "ollama"
url = "http://100.81.10.8:11434"   # csatapaci M2 Max 96GB
priority = 1

# Uncomment when local Ollama is running:
# [[providers]]
# type = "ollama"
# url = "http://localhost:11434"
# priority = 2
