# alpha-swarm configuration
# Override with environment variables: ALPHA_SWARM_OLLAMA_URL, etc.

# All Ollama runs on csatapaci (M2 Max 96GB) — embeddings, planning, agent
[ollama]
url = "http://100.81.10.8:11434"   # csatapaci

[surrealdb]
# mode: embedded (in-process surrealkv, daemon = sole owner; default)
#       remote   (external server at `url` — escape hatch)
#       nats     (no direct DB; go through the daemon bridge swarm.db.>)
mode = "embedded"
# Durable location — /tmp would be wiped on reboot (incl. learned SONA patterns).
path = "/Users/markkovari/.local/share/alpha-swarm/surrealdb/embedded"
url = "127.0.0.1:8001"             # only used when mode = "remote"
namespace = "alpha_swarm"
database = "swarm"
username = "root"
password = "root"
bridge_timeout_secs = 30

[nats]
# Local system NATS daemon ("picur", ~/Library/NATS/nats-server.conf) —
# clustered with csatapaci as "alpha_swarm". 8MB max_payload.
url = "nats://127.0.0.1:4223"

[claude]
# api_key = ""  # Set via ANTHROPIC_API_KEY env var
model = "claude-sonnet-4-20250514"

[defaults]
embed_model = "nomic-embed-text"    # 768-dim; must match knowledge_base::EMBED_DIM
simple_model = "qwen2.5-coder:7b"
project = "default"

# --- Agent Tiers ---
# All inference on csatapaci. Orchestrator uses 14b (fast), agent uses 32b (quality).
[tiers.orchestrator]
model = "qwen2.5-coder:14b"
context_window = 16384
time_limit_secs = 14400         # 4 hours
token_limit = 1000000           # 1M tokens
max_iterations = 20
max_backoff_secs = 60
max_context_files = 100

[tiers.agent]
model = "qwen3:32b"
context_window = 16384
time_limit_secs = 1800          # 30 min
token_limit = 300000            # 300K tokens
max_iterations = 10
max_backoff_secs = 30
max_context_files = 50

[tiers.worker]
model = "qwen2.5-coder:7b"
context_window = 8192
time_limit_secs = 300           # 5 min
token_limit = 100000            # 100K tokens
max_iterations = 5
max_backoff_secs = 10
max_context_files = 20

# --- Resource Limits ---
[resources]
max_cpu_percent = 80.0
max_ram_percent = 80.0
check_interval_secs = 10
max_concurrent_agents = 3
max_sub_plan_depth = 3

[[resources.hosts]]
name = "local"
type = "local"

[[resources.hosts]]
name = "csatapaci"
type = "ollama"
ollama_url = "http://100.81.10.8:11434"

# --- Inference Providers ---
# Multiple providers may be listed; lower `priority` is preferred, with
# failover to the next. Mix local + cloud freely.
#
# Supported `type`s:
#   ollama                         — local (native); url = Ollama host
#   claude | anthropic             — Anthropic (native); api_key + model
#   gemini | google               — Google Gemini via OpenAI-compat; url
#                                    optional (defaults to the Gemini endpoint)
#   openai | groq | together | vllm | lmstudio | openai-compat
#                                    — any OpenAI-compatible endpoint; set url
#                                      to its base (e.g. https://api.openai.com)

# Default: Ollama on csatapaci for everything (embeddings + planning + agent).
[[providers]]
type = "ollama"
url = "http://100.81.10.8:11434"   # csatapaci M2 Max 96GB
priority = 1

# --- Cloud examples (uncomment + set api_key to use; keys via env preferred) ---
# [[providers]]
# type = "gemini"                  # url omitted → uses the Gemini OpenAI-compat endpoint
# api_key = "..."                  # or export GEMINI_API_KEY and reference it
# model = "gemini-2.5-flash"
# priority = 2
#
# [[providers]]
# type = "openai"
# url = "https://api.openai.com"
# api_key = "..."
# model = "gpt-4o-mini"
# priority = 3
#
# [[providers]]
# type = "claude"
# api_key = "..."                  # or ANTHROPIC_API_KEY
# model = "claude-sonnet-4-20250514"
# priority = 4
#
# [[providers]]
# type = "groq"
# url = "https://api.groq.com/openai"
# api_key = "..."
# model = "llama-3.3-70b-versatile"
# priority = 5

# --- Autonomous operation (OFF by default) ---
# When enabled, the daemon drains the autopilot_goal backlog on its own:
# idle-gated, one run at a time, hard daily cap. Queue goals via the bridge
# subject `swarm.db.autopilot.queue` ({project, goal}).
[autopilot]
enabled = false
tick_secs = 300
max_runs_per_day = 5
auto_approve = true

# Embedded Wassette WASM tool host. Tools are sandboxed WASM components run
# in-process (deny-by-default capabilities). Each [[wassette.tools]] entry is
# loaded on startup and granted ONLY the listed capabilities. Build a tool
# component first, e.g. codegraph:
#   env WASI_SDK_PATH=~/.local/wasi-sdk CC_wasm32_wasip2=~/.local/wasi-sdk/bin/clang \
#       AR_wasm32_wasip2=~/.local/wasi-sdk/bin/llvm-ar \
#       cargo build --release --target wasm32-wasip2 -p tool-codegraph
[wassette]
enabled = true
component_dir = "/tmp/alpha-swarm/wassette/components"

# Multi-language code knowledge-graph extraction (tree-sitter). Needs read
# access to the repos it analyzes (the daemon also lazily grants the per-run
# repo at call time, so fs_read here is just a startup convenience).
[[wassette.tools]]
wasm = "/Users/markkovari/DEV/markkovari/alpha-swarm2/target/wasm32-wasip2/release/tool_codegraph.wasm"
fs_read = ["/Users/markkovari/DEV/markkovari/alpha-swarm2"]

# Sandboxed filesystem tools (read_file / list_files / grep). Enabling these
# OVERRIDES the native fs tools of the same name with the WASM versions, which
# are disk-mode only (no FileProvider / zero-disk support). The daemon injects
# repo-path and lazily grants read on each run's repo, so no fs_read needed.
# Uncomment to migrate the fs tool surface to WASM:
# [[wassette.tools]]
# wasm = "/Users/markkovari/DEV/markkovari/alpha-swarm2/target/wasm32-wasip2/release/tool_fs.wasm"

# Sandboxed HTTP fetch (overrides native fetch_url). Capability-scoped: it can
# ONLY reach the hosts listed in `net` (deny-by-default). Add the hosts your
# agents should be allowed to fetch. Uncomment to enable:
# [[wassette.tools]]
# wasm = "/Users/markkovari/DEV/markkovari/alpha-swarm2/target/wasm32-wasip2/release/tool_fetch.wasm"
# net = ["docs.rs", "crates.io", "raw.githubusercontent.com"]
