[package]
name = "orchestrator-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarm-orchestrator = { path = "../../crates/orchestrator", default-features = false }
inference-client = { path = "../../crates/inference-client", default-features = false }
edit-parser = { path = "../../crates/edit-parser" }
virt-git = { path = "../../crates/virt-git" }

[lib]
crate-type = ["cdylib"]
