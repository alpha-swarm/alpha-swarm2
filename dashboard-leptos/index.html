<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>alpha-swarm</title>
    <link data-trunk rel="rust" data-wasm-opt="z"/>
    <!-- Vendored 3D graph stack (3d-force-graph = three.js + d3-force-3d, UMD).
         copy-file lands them in dist/; the <script> tags expose the globals
         (ForceGraph3D, then window.AlphaGraph) BEFORE the WASM bundle runs. -->
    <link data-trunk rel="copy-file" href="3d-force-graph.min.js"/>
    <link data-trunk rel="copy-file" href="graph-bridge.js"/>
    <script src="3d-force-graph.min.js"></script>
    <script src="graph-bridge.js"></script>
    <style>
        :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --muted:#8b949e; --accent:#3b82f6; --ok:#2ea043; --fail:#f85149; --run:#d29922; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
        header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
        header h1 { font-size:17px; margin:0; font-weight:600; }
        header .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
        /* App shell: sidebar nav (engram-style) + content that fills the width. */
        .app { display:flex; min-height:calc(100vh - 49px); }
        .sidebar { flex:0 0 196px; border-right:1px solid var(--border); padding:14px 10px;
                   display:flex; flex-direction:column; gap:4px; position:sticky; top:0;
                   height:calc(100vh - 49px); overflow:auto; }
        .nav-item { display:block; width:100%; text-align:left; background:transparent; border:0;
                    padding:9px 11px; border-radius:7px; color:var(--muted); cursor:pointer; font-weight:500; }
        .nav-item:hover { background:var(--panel); color:var(--fg); filter:none; }
        .nav-item.active { background:var(--bg); color:var(--fg); border:1px solid var(--border); }
        .sidebar-foot { margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
        .sidebar-foot textarea { min-height:48px; font-size:12px; }
        .content { flex:1; min-width:0; padding:18px; overflow-x:hidden; display:grid; gap:22px; align-content:start; }
        .graph-section { display:flex; gap:16px; height:calc(100vh - 49px - 36px); }
        .graph-main { flex:1; min-width:0; display:flex; flex-direction:column; }
        .graph-main h2 { flex:0 0 auto; }
        .inspector { flex:0 0 360px; overflow:auto; }
        .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
        .panel h2 { margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
        input, textarea, button, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:9px 11px; }
        textarea { width:100%; min-height:64px; resize:vertical; }
        .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
        button:hover { filter:brightness(1.1); }
        button:disabled { opacity:.5; cursor:default; }
        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
        th { color:var(--muted); font-weight:500; font-size:12px; }
        td.goal { max-width:420px; }
        .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; }
        .s-passed { background:rgba(46,160,67,.18); color:var(--ok); }
        .s-failed,.s-cancelled { background:rgba(248,81,73,.18); color:var(--fail); }
        .s-running,.s-planning,.s-planned,.s-approved,.s-pending { background:rgba(210,153,34,.18); color:var(--run); }
        .muted { color:var(--muted); }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
        @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }
        /* 3D graph: 3d-force-graph defaults its canvas to window width, which can
           overflow the capped container and force a horizontal scrollbar. Clamp
           the lib's wrapper + canvas to the container, and never let the page
           scroll sideways. */
        html, body { overflow-x:hidden; max-width:100vw; }
        #graph3d { flex:1; min-height:0; width:100%; max-width:100%; contain:layout size; }
        #graph3d > div, #graph3d canvas { max-width:100% !important; }
        @media (max-width:820px) {
            .app { flex-direction:column; }
            .sidebar { flex-direction:row; flex-wrap:nowrap; height:auto; position:static;
                       overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); }
            .sidebar-foot { margin-top:0; border-top:0; }
            .graph-section { flex-direction:column; height:auto; }
            .inspector { flex-basis:auto; }
            #graph3d { height:55vh; flex:none; }
        }
    </style>
</head>
<body></body>
</html>
