# DEPLOYMENT NOTE (2026-06): this manifest targets a wadm + washlet control
# plane. wash 2.x `wash host` does NOT accept wadm placements (status stays
# "undeployed"), and wadm 0.21 cannot drive it. The CURRENT deploy path is
# per-component `wash dev` from each component dir (see infra notes), with the
# agent-daemon owning the embedded DB + NATS bridge. Keep this manifest for a
# future washlet/wadm host; the wasmcloud:messaging link below activates only
# under a host that provides a real NATS messaging provider (wash dev's is
# in-memory only — components fall back to the daemon HTTP shim).
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: alpha-swarm
  annotations:
    version: v0.1.0
    description: "Distributed AI agent swarm for code editing"
spec:
  components:
    # === WASI Components ===

    # API Server — serves REST API + MCP JSON-RPC
    - name: api-server
      type: component
      properties:
        image: file://target/wasm32-wasip2/release/api_server.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: httpserver
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: default-http
                properties:
                  address: 0.0.0.0:8080
        # NATS request-reply to the agent-daemon DB bridge (swarm.db.>)
        - type: link
          properties:
            target: messaging-nats
            namespace: wasmcloud
            package: messaging
            interfaces: [consumer]
            target_config:
              - name: db-bridge-nats
                properties:
                  cluster_uris: nats://127.0.0.1:4223

    # Agent Worker — runs LLM inference + edit parsing
    - name: agent-worker
      type: component
      properties:
        image: file://target/wasm32-wasip2/release/agent_worker.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        # HTTP outgoing for Ollama calls
        - type: link
          properties:
            target: httpclient
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]
        # Blobstore for workspace file operations
        - type: link
          properties:
            target: blobstore-nats
            namespace: wasi
            package: blobstore
            interfaces: [blobstore]
            source_config:
              - name: workspace-storage
                properties:
                  bucket_name: agent-workspaces

    # Tool Search — code search via tree-sitter + grep
    - name: tool-search
      type: component
      properties:
        image: file://target/wasm32-wasip2/release/tool_search.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: httpclient
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]

    # Tool Web — web search + URL fetch
    - name: tool-web
      type: component
      properties:
        image: file://target/wasm32-wasip2/release/tool_web.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: httpclient
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]

    # MCP Server — Model Context Protocol (Streamable HTTP)
    - name: mcp-server
      type: component
      properties:
        image: file://target/wasm32-wasip2/release/mcp_server.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: httpserver
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: mcp-http
                properties:
                  address: 0.0.0.0:8090
        - type: link
          properties:
            target: httpclient
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]

    # === Capability Providers (host plugins) ===

    # HTTP Server — serves incoming requests
    - name: httpserver
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.23.2

    # HTTP Client — outgoing HTTP requests (Ollama, SurrealDB)
    - name: httpclient
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-client:0.12.1

    # Blobstore NATS — file storage via NATS JetStream Object Store
    - name: blobstore-nats
      type: capability
      properties:
        image: ghcr.io/wasmcloud/blobstore-nats:0.3.0
        config:
          - name: nats-connection
            properties:
              endpoint: nats://127.0.0.1:4223

    # Messaging NATS — request-reply to the agent-daemon DB bridge
    - name: messaging-nats
      type: capability
      properties:
        image: ghcr.io/wasmcloud/messaging-nats:0.19.0

    # === Native Services (standalone, communicate via NATS) ===
    #   - git-provider (swarm.git.*)
    #   - agent-daemon (orchestrator; embeds SurrealDB and serves the
    #     swarm.db.> request-reply bridge — sole DB owner)
    #
    # === Undeployed components (source exists, NOT in this manifest) ===
    #   knowledge-store, orchestrator-worker, quality-gate-worker,
    #   tools-worker — deferred; do not wire them to providers without
    #   also adding them here.
