apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: alpha-swarm
  annotations:
    description: "Distributed agent orchestration system"
    version: "0.1.0"

spec:
  components:
    # --- WASI Components ---

    - name: agent-worker
      type: component
      properties:
        image: file://./build/agent_worker_s.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: ollama-provider
            namespace: alpha-swarm
            package: ollama
            interfaces: [inference]
        - type: link
          properties:
            target: virtfs-provider
            namespace: alpha-swarm
            package: virtfs
            interfaces: [repository]
        - type: link
          properties:
            target: quality-gate-provider
            namespace: alpha-swarm
            package: quality
            interfaces: [gate]
        - type: link
          properties:
            target: knowledge-base-provider
            namespace: alpha-swarm
            package: knowledge
            interfaces: [base]

    - name: orchestrator
      type: component
      properties:
        image: file://./build/orchestrator_s.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: ollama-provider
            namespace: alpha-swarm
            package: ollama
            interfaces: [inference]
        - type: link
          properties:
            target: virtfs-provider
            namespace: alpha-swarm
            package: virtfs
            interfaces: [repository]
        - type: link
          properties:
            target: quality-gate-provider
            namespace: alpha-swarm
            package: quality
            interfaces: [gate]
        - type: link
          properties:
            target: knowledge-base-provider
            namespace: alpha-swarm
            package: knowledge
            interfaces: [base]

    # --- Capability Providers ---

    - name: ollama-provider
      type: capability
      properties:
        image: file://./build/ollama_provider
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    - name: virtfs-provider
      type: capability
      properties:
        image: file://./build/virtfs_provider
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    - name: quality-gate-provider
      type: capability
      properties:
        image: file://./build/quality_gate_provider
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    - name: knowledge-base-provider
      type: capability
      properties:
        image: file://./build/knowledge_base_provider
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: knowledge-base-provider
            namespace: alpha-swarm
            package: knowledge
            interfaces: [base]
            target_config:
              - name: surrealdb
                properties:
                  url: "ws://127.0.0.1:8000"
                  namespace: "alpha_swarm"
                  database: "swarm"
